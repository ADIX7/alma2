name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/alma
      - name: Formatting (Linux)
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Disposable rehearsal (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/rehearse.sh

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: 386
            ext: ""
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: 386
            ext: .exe
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          EXT: ${{ matrix.ext }}
        run: go build -trimpath -o "dist/alma-${GOOS}-${GOARCH}${EXT}" ./cmd/alma
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: alma-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/alma-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build CI image
        run: docker build -f Dockerfile.ci -t alma2-ci .
      - name: Run CI container
        run: docker run --rm alma2-ci
