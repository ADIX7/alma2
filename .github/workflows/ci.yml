name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/alma
      - name: Formatting (Linux)
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Disposable rehearsal (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/rehearse.sh

  cross-build:
    uses: ./.github/workflows/build.yml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build CI image
        run: docker build -f Dockerfile.ci -t alma2-ci .
      - name: Run CI container
        run: docker run --rm alma2-ci
